# ConnectorType "i2c-port", socket side. A downstream I2C port — offered by an
# I2C-mux channel (scope-creating, S8) or a board I2C header.

description: |
  An I2C port. socket,i2c names the bus it exposes — for a mux channel that is
  a NEW scope rooted in the mux device (S8), not a pass-through.

compatible: "socket,i2c-port"

properties:
  socket,i2c:
    type: phandle
    required: true
  socket,stackable:
    type: boolean
    description: an I2C bus hosts many devices — N modules may share the port
