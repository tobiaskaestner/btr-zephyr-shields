# S4-b (reject) — two Temp&Hum clicks on DIFFERENT sockets that nonetheless
# share the I2C bus (all four Quail sockets -> i2c1). HTS221 is fixed at 0x5f,
# so the two collide regardless of socket choice — the shared-bus regime makes
# socket selection no escape (R9/R15). Today: silent S3-style collapse.

rig:
  name: quail-dup-th
  board: mikroe_quail
  instances:
    - name: th_2
      shield: temp-hum-click
      socket: quail_sock2            # -> i2c1 @0x5f
    - name: th_4
      shield: temp-hum-click
      socket: quail_sock4            # -> i2c1 @0x5f  (same bus, same fixed address)
