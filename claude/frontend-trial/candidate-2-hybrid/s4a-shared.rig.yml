# S4-a (reject) — the cross-socket sharing case (R13). The PIR in socket 5
# (its SIG0 -> gpio0 26) and the button in socket 6 (its SIG1 -> gpio0 26) both
# drive the SAME SoC pin, though they sit in different sockets and use
# different pin positions. Today nothing models this — the two would silently
# fight on ADC0. The expander detects it from net identity and rejects,
# naming the shared SoC pin and both claimants.

rig:
  name: makerpi-grove-clash
  board: cytron_maker_pi_rp2040
  instances:
    - name: motion_1
      shield: grove-pir
      socket: grove5                 # SIG0 -> gpio0 26
    - name: button_1
      shield: grove-button
      socket: grove6                 # SIG1 -> gpio0 26  (aliases grove5 SIG0)
