# The first NESTED carrier promotion into the permanent corpus
# (grove-carriers-brief.md Sec 7/acceptance criterion 3): a Seeed Grove
# Base Shield V2 on the Nucleo Arduino header re-exports typed Grove
# sockets, and one I2C shield (grove_sens_bme280, default 0x76 domain, no
# config: needed) plus one digital shield (grove_btn) plug straight into
# two of THOSE exposed sockets -- exactly nucleo_mux_farm's own
# carrier-then-instance shape (S8), now through a passive carrier instead
# of an active mux, and the first corpus rig to exercise
# dts/bindings/connectors/grove.yaml's socket,i2c pass-through THROUGH a
# composed exposed socket rather than a real board one (grove_sens_pinned
# sits directly on the NanoC6's own board-DT grove_1).
#
# nucleo_f401re is picked over frdm_k64f (both carry the arduino_r3 alias
# with socket,i2c -- grove-carriers-brief.md Sec 5) because it already
# anchors the most corpus goldens (nucleo_datalogger, nucleo_wifi_logger[_ok],
# nucleo_mux_farm, pilot_variants, shield_rev_pilot/family, ard_datalogger,
# nucleo_mux_clash) -- test_emitted_corpus.py's cached-plain-build pattern
# configures each board exactly once per session regardless of how many
# rigs name it, so sitting beside this board's own goldens adds no new
# plain-build cost at all, where frdm_k64f (2 existing rigs) or a sixth
# board (0) would.
#
# light_a (L4-ADC, item 35/backlog): grove_light on grove_1's grove_a0 --
# the ADC-through-a-carrier witness this slice exists to reach
# (l4-adc-brief.md Sec 5/acceptance criterion 3). EXTENDING this rig
# rather than adding a sibling: nucleo_f401re's own zephyr.dts golden is
# already moving in this slice (its socket gained a real io-channel-map,
# l4-adc-brief.md Sec 2), so a new instance here costs nothing extra --
# where a fresh rig would need a whole new golden set for no added
# coverage. grove_a0's own io-channel-map (boards/shields/grove/
# seeed_grove_base_v2.shield) targets ARDUINO_HEADER_R3_A0 (SIG0) and
# ARDUINO_HEADER_R3_A1 (SIG1) on the arduino-r3 plug -- both now real
# io-channel-map entries on nucleo_f401re's own socket (single parent,
# &adc1), so this stays a single-parent witness; the multi-parent case
# (frdm_k64f's A0-A3 split across &adc0/&adc1) is confirmed by a
# dedicated board_edt unit test instead (l4-adc-brief.md Sec 3/acceptance
# criterion 5), since nothing in this rig's own topology needs two
# parents to resolve.
#
# pwm_a/pwm_b (L4-PWM, item 36/backlog): grove_pwm_led on grove_1's
# grove_d3 (SIG0 = D3), grove_pwm_led_inv on grove_1's grove_d6
# (SIG0 = D6) -- the PWM-through-a-carrier witness this slice exists to
# reach (l4-pwm-brief.md Sec 5/acceptance criterion 3), same
# extend-don't-duplicate reasoning as light_a above: this rig's own
# nucleo_f401re socket golden is already moving in this slice (a real
# pwm-map, l4-pwm-brief.md Sec 2), so two more instances cost nothing
# extra in new goldens. D3 and D6 are picked because BOTH resolve on
# BOTH boards this rig's own tests.yaml already builds on (nucleo_f401re:
# D3 -> &pwm2 ch2, D6 -> &pwm2 ch3; frdm_k64f: D3 -> &ftm0 ch6, D6 ->
# &ftm0 ch1 -- see each board's own arduino_r3_socket.dtsi comment for the
# sourcing), and neither collides with btn_a's own D2 (grove_d2's SIG1 is
# D3, but btn_a's own grove_btn shield claims only SIG0/D2 -- rigc does
# not model cross-socket net sharing as a build-time conflict, matching
# the SAMD21 lotus_pwm_clash precedent's own point that such clashes are
# a documented real-hardware fact, not something this corpus's own
# structural resolution refuses). pwm_b's shield (grove_pwm_led_inv,
# boards/shields/grove_led/) is a purpose-built local variant (not a
# bridle port): it exists solely to carry a NONZERO PWM flags value
# (PWM_POLARITY_INVERTED) onto one of these real 3-cell sockets
# (l4-pwm-brief.md Sec 6 acceptance criterion 5/item 34's own
# capability) -- grove_pwm_led's own literal PWM_POLARITY_NORMAL is
# always zero, so it alone could never exercise that path on real
# hardware. The multi-parent PWM case itself (four timers on nucleo,
# two FTMs on frdm_k64f) is structural in each board's own socket map
# regardless of which rig uses it, and is additionally confirmed by a
# dedicated board_edt unit test (l4-pwm-brief.md Sec 3), the same
# belt-and-suspenders style light_a's own multi-parent ADC case used.
instances:
  - name: grove_1
    shield: seeed_grove_base_v2
    socket: arduino_r3
  - name: sensor_a
    shield: grove_sens_bme280
    socket: grove_1.grove_i2c
  - name: btn_a
    shield: grove_btn
    socket: grove_1.grove_d2
    params:
      gb_key:
        zephyr,code: INPUT_KEY_0
  - name: light_a
    shield: grove_light
    socket: grove_1.grove_a0
  - name: pwm_a
    shield: grove_pwm_led
    socket: grove_1.grove_d3
  - name: pwm_b
    shield: grove_pwm_led_inv
    socket: grove_1.grove_d6
