# S1 (fidelity milestone) — the baseline: one board, one shield, today's model.
# Adafruit Data Logger on the Nucleo Arduino header — the exact setup of
# `west build -b nucleo_f401re --shield adafruit_data_logger`, ported to the
# btr-shields downstream tree (board id: nucleo_f401re_btr). The generated
# overlay must be EQUIVALENT (R2 — not byte-identical; labels may differ) to
# the legacy shield overlay's output.
#
# Ported from frontend-trial/candidate-2-hybrid/s1-datalogger.rig.yml;
# board reference adjusted from `nucleo_f401re` to `nucleo_f401re_btr` (T2).

rig:
  name: nucleo-datalogger
  board: nucleo_f401re_btr
  instances:
    - name: logger
      shield: adafruit-data-logger
      socket: nucleo_ard
