# lotus-pwm — umbrella-subsystem activation (option A).
#
# Assembly: 1x grove_servo (PWM, vnd,pwm-servo) + 1x grove_light (ADC,
# vnd,light-sensor). The rig's shields carry no Kconfig.defconfig of their
# own (only SHIELD_<NAME> identification symbols) — enabling the subsystems
# the instantiated shields' DRIVERS actually need is the rig's job, not the
# shield's or the expander's. Minimal: just the umbrellas.
CONFIG_PWM=y
CONFIG_ADC=y
