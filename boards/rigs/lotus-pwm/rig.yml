# Slice A (realizable) — the same physical pin used as PWM and as ADC, on the
# real Seeeduino Lotus. A servo on grove_d2 (PWM → tcc0 ch0) and a light sensor
# on grove_a0 (ADC → adc0 ch0). The expander resolves each position through the
# board's per-function nexus (socket,pwm-map / socket,adc-map), emits resolved
# `pwms`/`io-channels`, enables the controllers, and notes the board pin-mux.
# Exercises ontology Refinement 1: functions live on endpoints, not nets.
#
# Ported from frontend-trial/candidate-2-hybrid/lotus-pwm.rig.yml (P3 3c);
# board reference migrated (E3, board-extension-migration.md) to the hwmv2
# board EXTENSION `rig` variant of the real upstream seeeduino_lotus (the
# CROSS-MODULE case: the base lives in the bridle Zephyr module, which is
# not a west manifest project -- every build of this target must pass
# -DEXTRA_ZEPHYR_MODULES=<west-topdir>/bridle explicitly) -- was
# `seeeduino_lotus_btr` (the clone; still present, deleted in slice E4);
# shield identities underscored (grove-servo -> grove_servo, grove-light ->
# grove_light).

rig:
  name: lotus-pwm
  board: seeeduino_lotus/samd21g18a/rig
  instances:
    - name: servo_1
      shield: grove_servo
      socket: grove_d2               # SIG0 → PWM tcc0 ch0
    - name: light_1
      shield: grove_light
      socket: grove_a0               # SIG0 → ADC adc0 ch0
