# S1 (fidelity milestone) — the baseline: one board, one shield, today's model.
# Adafruit Data Logger on the Nucleo Arduino header — the exact setup of
# `west build -b nucleo_f401re --shield adafruit_data_logger`. The generated
# overlay must be EQUIVALENT (R2 — not byte-identical; labels may differ) to
# the legacy shield overlay's output.
#
# Ported from frontend-trial/candidate-2-hybrid/s1-datalogger.rig.yml; board
# reference migrated to the hwmv2 board EXTENSION `rig` variant of the REAL
# upstream nucleo_f401re (E1, board-extension-migration.md) — was
# `nucleo_f401re_btr` (the clone; still present, deleted in slice E4).

rig:
  name: nucleo-datalogger
  board: nucleo_f401re/stm32f401xe/rig
  instances:
    - name: logger
      shield: adafruit_data_logger
      socket: nucleo_ard
