# S5 — MikroE Quail temperature farm: CS pool (two Flash Clicks sharing spi1's
# CS pool across sockets 1/2) and an address strap (two Temp Clicks on the
# shared i2c1 — one free-allocated, one pinned via `pin: addr_strap`, R18).
#
# Ported from frontend-trial/candidate-2-hybrid/s5-temp-farm.rig.yml; board
# reference migrated (E2) to the hwmv2 board EXTENSION `rig` variant of the
# real upstream mikroe_quail — was `mikroe_quail_btr` (the clone; deleted
# in slice E4).

rig:
  name: quail_temp_farm
  board: mikroe_quail/stm32f427xx/rig

  instances:
    - name: flash_a
      shield: flash_click
      socket: quail_sock1
    - name: flash_b
      shield: flash_click
      socket: quail_sock2
    - name: temp_a
      shield: temp_click
      socket: quail_sock3
    - name: temp_b
      shield: temp_click
      socket: quail_sock4
      pin:
        addr_strap: 0x49         # pinned allocation (R18)
