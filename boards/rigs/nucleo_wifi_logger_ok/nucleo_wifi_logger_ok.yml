# S2 (realizable) — the same WiFi data logger, made buildable by moving the
# WINC's IRQ jumper off the RTC's D7 to D2. Nothing else changes: the CS clash
# is resolved by allocation (SD copper-fixed D10 -> index 0; WiFi pool -> D9,
# index 1), and expansion emits the overlay plus a config sheet listing the two
# physical actions (set the IRQ jumper; route the allocated CS to D9).
#
# This is what R6 buys: a pin clash that a plain shield overlay forces into a
# forked overlay is here a one-line instantiation parameter.

instances:
  - name: logger_1
    shield: adafruit_data_logger
    socket: arduino_r3
  - name: wifi_1
    shield: adafruit_winc1500
    socket: arduino_r3
    pin:
      irq_jmp: D2                  # move IRQ off the RTC's D7
