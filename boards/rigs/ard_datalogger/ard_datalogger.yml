# Board-agnostic content: one Adafruit Data Logger on the CONVENTIONAL
# arduino_r3 socket alias -- both nucleo_f401re/stm32f401xe/rig and
# frdm_k64f/mk64f12/rig carry that alias on their own Arduino header (S5),
# so this one file resolves on either board with no per-board sockets:
# translation needed at all. Nothing here needs to change to build on the
# other host, only the invocation's --board (or -b) does.
instances:
  - name: logger
    shield: adafruit_data_logger
    socket: arduino_r3
