# The same physical pin used as PWM and as ADC, on the real Seeeduino Lotus.
# A servo on grove_d2 (PWM → tcc0 ch0) and a light sensor on grove_a0 (ADC →
# adc0 ch0). The expander resolves each position through the board's
# per-function nexus (pwm-map / io-channel-map), emits resolved
# pwms/io-channels, enables the controllers, and notes the board pin-mux.
# Exercises ontology Refinement 1: functions live on endpoints, not nets.
#
# seeeduino_lotus is a CROSS-MODULE hwmv2 board EXTENSION: its base lives in
# the bridle Zephyr module, which is not a west manifest project -- every
# build of this target must pass -DEXTRA_ZEPHYR_MODULES=<west-topdir>/bridle
# explicitly.

instances:
  - name: servo_1
    shield: grove_servo
    socket: grove_d2               # SIG0 → PWM tcc0 ch0
  - name: light_1
    shield: grove_light
    socket: grove_a0               # SIG0 → ADC adc0 ch0
