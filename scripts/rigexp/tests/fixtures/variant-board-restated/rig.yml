# Synthetic fixture: rule 10 widened -- a non-default variant declaring
# its OWN board and socket map, but restating the default's verbatim, with
# no fragment file either. A bare board: key's presence is not itself
# contribution: a variant that changes nothing is exactly what rule 10
# exists to catch, and this is the case the weaker (presence-only)
# reading would have missed.
rig:
  name: variant-board-restated
  variants:
    default: nucleo
    list:
      - name: nucleo
        board: nucleo_f401re/stm32f401xe/rig
        sockets: {ard: nucleo_ard}
      - name: nucleo_again
        board: nucleo_f401re/stm32f401xe/rig
        sockets: {ard: nucleo_ard}
