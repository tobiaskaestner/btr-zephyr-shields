# Synthetic fixture: a mapping entry ({name:, board:}) inside a
# NON-variant axis's list:. Only a rig's variants: axis may take that
# shape -- a revision is a change within one physical family, never a
# move to a different host board, so revisions: takes bare names only.
rig:
  name: revision-mapping-entry
  board: nucleo_f401re/stm32f401xe/rig
  revisions:
    default: "1"
    list: ["1", {name: "2", board: nucleo_f401re/stm32f401xe/rig}]
