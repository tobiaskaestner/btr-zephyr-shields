# Synthetic fixture (analyzer bundle, 2026-07-23): a servo shield authoring a
# nonzero PWM flags value (PWM_POLARITY_INVERTED) on a real PWM-capable Grove
# socket. Every real corpus shield authors flags=0, so this fixture (+ its
# own tiny grove_servo_flags shield under fixtures/pwm-nonzero-flags/shields/)
# is the only thing locking the analyzer's phys-function rejection —
# analyzer.py:_collect_channel, moved from the emitter's former ValueError
# (which violated the emitter's "cannot fail" contract, cli.py).
rig:
  name: pwm-nonzero-flags
  board: seeeduino_lotus_btr
  instances:
    - name: servo_1
      shield: grove_servo_flags
      socket: grove_d2
