# Synthetic fixture: rule 8 -- remove-instances: naming an absent
# instance. variant 'b' removes 'logger'; revision '2' (family-wide, so it
# applies regardless of variant) tries removing it AGAIN -- the message
# must NAME the variant that already did it, so drift cannot hide.
rig:
  name: remove-instance-drift
  board: nucleo_f401re/stm32f401xe/rig
  revisions:
    default: 1
    list: [1, 2]
  variants:
    default: a
    list: [a, b]
  instances:
    - name: logger
      shield: adafruit_data_logger
      socket: nucleo_ard
