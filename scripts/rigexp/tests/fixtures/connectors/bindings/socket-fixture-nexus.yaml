# SPDX-License-Identifier: Apache-2.0
description: |
  Purpose-built connector type for test_controller_label.py's fixture board
  only -- not a copy of any dts/bindings/connectors/*.yaml binding. No real
  board ever compiles this compatible, and no shield.yml/rig.yml ever
  references it: ctypes_registry.py's connector-type registry always reads
  the real dts/bindings/connectors directory, never this one, so this file
  is invisible to shields.py's plug-type check and to the analyzer's
  type-facts lookup. It exists solely to give board_edt.py a socket,* node
  to project, with its own gpio-map/pwm-map nexus, entirely inside the
  fixture tree.

  Every nexus property below is declared INLINE rather than via
  include: [gpio-nexus.yaml, base.yaml] (Zephyr's own bindings) -- the
  technique dts/bindings/connectors/grove.yaml already uses for its
  pwm-map/io-channel-map (dtschema include: cannot downgrade an included
  property's required: true), applied here to gpio-map/#gpio-cells too, so
  this file needs no bindings directory outside the fixture tree at all.
  Zephyr's base.yaml is not needed either: edtlib always allows a node to
  carry "compatible" with no binding declaration (its own built-in
  allow-list, devicetree.edtlib.Node._check_undeclared_props), and this
  fixture's nodes set nothing else base.yaml would otherwise cover (no reg,
  no status, no label property).

compatible: "socket,fixture-nexus"

properties:
  "#gpio-cells":
    type: int
    required: true
    const: 2
  gpio-map:
    type: compound
    required: true
  gpio-map-mask:
    type: array
  gpio-map-pass-thru:
    type: array
  "#pwm-cells":
    type: int
  pwm-map:
    type: compound
  pwm-map-mask:
    type: array
  pwm-map-pass-thru:
    type: array

gpio-cells:
  - pin
  - flags
