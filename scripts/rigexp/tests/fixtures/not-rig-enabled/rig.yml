# (socketless_board.dts alongside this file, passed to the CLI via
# --board-dts) but declares no `socket,*` node — the expander must reject it
# with the DISTINCT "exists, but is not rig-enabled" phys-board diagnostic
# (boarddt.py; Conv. 4: a board opts in with a typed socket node). Sibling
# of the unknown-board fixture, which covers the other half (the board name
# resolving to nothing at all).
rig:
  name: not-rig-enabled
  board: socketless_board
  instances: []
