# ConnectorType "mikrobus", socket side. The connector type IS this binding
# pair (+ dt-bindings/connector/mikrobus.h indices) — there is no type
# devicetree. Board socket nodes with this compatible are validated by
# edtlib like any other node.

description: |
  mikroBUS socket. The node is a GPIO nexus: gpio-map child pins use the
  indices from dt-bindings/connector/mikrobus.h. Bus endpoints are declared
  as phandles onto the board's controllers. One module per socket.

compatible: "socket,mikrobus"

include: [base.yaml]

properties:
  "#gpio-cells":
    type: int
    required: true
    const: 2
  gpio-map:
    type: compound
    required: true
  socket,i2c:
    type: phandle
    description: I2C controller serving this socket's SDA/SCL
  socket,spi:
    type: phandle
    description: SPI controller serving this socket's SCK/MISO/MOSI
  socket,uart:
    type: phandle
    description: UART serving this socket's RX/TX
  socket,cs-pool:
    type: array
    default: [2]
    description: |
      Ordered CS candidate positions (indices). mikroBUS has exactly one
      dedicated CS position per socket.
  # not stackable: absence of socket,stackable means one module per socket

gpio-cells:
  - pin
  - flags
