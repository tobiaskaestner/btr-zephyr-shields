# ConnectorType "grove", socket side (+ dt-bindings/connector/grove.h).

description: |
  Grove socket. GPIO nexus; gpio-map child pins use GROVE_* indices. The two
  signal positions map to SoC pins; DIFFERENT sockets whose positions map to
  the same SoC pin are the same net (Maker Pi RP2040: header5 SIG0 and header6
  SIG1 both reach gpio0 26) — the expander discovers this from net identity
  (R13). One module per socket.

compatible: "socket,grove"

include: [base.yaml]

properties:
  "#gpio-cells":
    type: int
    required: true
    const: 2
  gpio-map:
    type: compound
    required: true
  socket,i2c:
    type: phandle
    description: present on I2C Grove sockets; absent on digital/analog ones
