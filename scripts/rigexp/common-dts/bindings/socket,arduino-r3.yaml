# ConnectorType "arduino-r3", socket side (+ dt-bindings/connector/arduino-r3.h).

description: |
  Arduino UNO R3 socket. GPIO nexus; gpio-map child pins use
  ARDUINO_HEADER_R3_* indices. Bus endpoints as phandles; every bus property
  is optional — a board exposes the subset it wires (declared by absence,
  cf. nucleo_f401re without socket,uart). Stackable: stacked shields share
  the socket pass-through.

compatible: "socket,arduino-r3"

include: [base.yaml]

properties:
  "#gpio-cells":
    type: int
    required: true
    const: 2
  gpio-map:
    type: compound
    required: true
  socket,i2c:
    type: phandle
  socket,spi:
    type: phandle
  socket,uart:
    type: phandle
  socket,stackable:
    type: boolean
    description: present on all arduino-r3 sockets (type-level fact)
  socket,cs-pool:
    type: array
    default: [16, 15, 14]   # D10, D9, D8 — ordered CS candidates
    description: any digital pin may serve as CS by shield convention

gpio-cells:
  - pin
  - flags
