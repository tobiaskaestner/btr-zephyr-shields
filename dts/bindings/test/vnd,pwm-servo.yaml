# SPDX-License-Identifier: Apache-2.0

description: |
  Test PWM servo consumer (rig corpus, lotus-pwm/lotus-pwm-clash). Minimal
  typed binding so pass-2's edtlib resolves `pwms` through the real
  pwm-map nexus (Bridge-A rewrite step 2a) instead of leaving the property
  untyped — without a declared `type: phandle-array`, edtlib never attempts
  nexus resolution on it at all (the corpus gap step 2b's review found).

compatible: "vnd,pwm-servo"

properties:
  pwms:
    type: phandle-array
    required: true
