# btr-shields — Zephyr module for the rigs feature.
#
# btr-shields is a west manifest repo (its own `west.yml` imports zephyr), so
# it is discovered as a Zephyr module automatically at west-update time — no
# `EXTRA_ZEPHYR_MODULES` env var or `-DBOARD_ROOT`/`-DDTS_ROOT` cache var
# needed on the command line.
#
# The board_root/dts_root settings make this tree's own content discoverable
# the same way: board extensions (boards/extend/), shields (boards/shields/),
# rigs (boards/rigs/), and the connector-type bindings
# (dts/bindings/connectors/).
name: btr-shields
build:
  cmake-modules: cmake
  settings:
    # make boards/{extend,shields,rigs} discoverable
    board_root: .
    # make dts/bindings/connectors/ discoverable
    dts_root: .
