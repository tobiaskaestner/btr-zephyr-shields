CONFIG_I2C=y
CONFIG_ZTEST=y

# Promoted alone, the mux has no channel nodes: i2c_mux's four channels are
# `socket,i2c-port` SOCKETS, and a promoted shield is a single instance with
# nothing plugged into it. Zephyr's i2c_tca954x.c cannot compile against a
# childless mux -- `tca954x_channel_init` is referenced only from
# TCA954x_CHILD_DEFINE, so it trips -Werror=unused-function -- and no
# application-level Kconfig can fix that. The devicetree is still generated,
# validated and compiled, which is what this suite claims; only the driver
# is left out. Revisit when a rig (not a promotion) puts a device on a channel.
CONFIG_I2C_TCA954X=n
