CONFIG_SPI=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ZTEST=y

# Networking pulls sys_rand_get(), which has no provider on this board:
# quail's SoC chain does carry an `st,stm32-rng` node (via stm32f405.dtsi)
# but it is status = "disabled", and enabling it needs a devicetree
# overlay -- board content, which does not belong in a shield's test
# suite. The kernel's test-grade PRNG is the right answer for a suite that
# only builds: the link is what is under test here, not randomness quality.
CONFIG_TEST_RANDOM_GENERATOR=y
