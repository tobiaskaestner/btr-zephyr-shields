# Dev-tooling configuration only (mypy / pytest / coverage) — btr-shields is
# a Zephyr module, not a Python distribution. The commit gate is
# scripts/check.sh.

[tool.mypy]
check_untyped_defs = true
# yaml has no stubs here; the devicetree package (dtlib/edtlib) resolves with
# real types via MYPYPATH, which scripts/check.sh derives from $ZEPHYR_BASE.
ignore_missing_imports = true

# Zephyr's python-devicetree (via MYPYPATH): consume its type annotations at
# our call sites, but never report ITS internal errors — upstream is not ours
# to gate on (saferail 10: consume, don't patch).
[[tool.mypy.overrides]]
module = ["devicetree.*"]
ignore_errors = true

# PyYAML ships no inline types; its stubs are a separate types-PyYAML package
# that this gate does not require anyone to install. mypy >= 1.x reports that
# as `import-untyped`, which the global ignore_missing_imports above does NOT
# silence (that one covers imports it cannot resolve at all). Named explicitly
# so the gate gives the same answer with or without the stub package present.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

# Coverage of rigc's UNIT suite only (check.sh drives `coverage run -m
# pytest scripts/rigc/tests` directly — no pytest-cov dependency, the
# recorded T3 decision). This is the coverage the frozen suite's own
# lineage never had: it reaches the expander as a SUBPROCESS, so naive
# coverage would measure the harness and report near-zero on the modules
# under test. rigc's unit layer is in-process by definition, which makes
# this section sufficient. The frozen integration suite stays unmeasured.
[tool.coverage.run]
source_pkgs = ["rigc"]
omit = ["*/rigc/tests/*"]
data_file = ".reports/coverage-rigc"

[tool.coverage.report]
show_missing = true
# A floor, not a target: it exists because the emitted goldens no longer
# compare byte-for-byte, which makes the in-process unit layer the primary
# evidence that the tool is correct rather than a supplement to the golden
# suite. Set just below the measured figure so an unrelated one-point dip
# does not red the gate, and RATCHET it upward -- never down to accommodate
# new uncovered code.
fail_under = 88

[tool.pytest.ini_options]
# Top-level tests/ is reserved for twister test apps (Zephyr-module
# convention); python tests live with the package.
# integration_stay/ is deliberately absent: this file travels with
# scripts/rigc/ to bridle, and integration_stay/ does not -- naming it
# here would ship a path that does not exist at the destination. A bare
# `pytest` therefore collects only the travelling suite; run
# scripts/check-extended.sh (or `pytest scripts/rigc/tests/integration_stay`
# directly) for the stay-side one.
testpaths = ["scripts/rigc/tests/integration"]
markers = [
    "build: runs west/cmake builds (slow resolved-corpus goldens); deselect with -m 'not build'",
]
