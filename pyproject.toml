# Dev-tooling configuration only (mypy / pytest) — btr-shields is a Zephyr
# module, not a Python distribution. The commit gate is scripts/check.sh.

[tool.mypy]
check_untyped_defs = true
# yaml has no stubs here; the devicetree package (dtlib/edtlib) resolves with
# real types via MYPYPATH, which scripts/check.sh derives from $ZEPHYR_BASE.
ignore_missing_imports = true

# Zephyr's python-devicetree (via MYPYPATH): consume its type annotations at
# our call sites, but never report ITS internal errors — upstream is not ours
# to gate on (saferail 10: consume, don't patch).
[[tool.mypy.overrides]]
module = ["devicetree.*"]
ignore_errors = true

[tool.pytest.ini_options]
# Top-level tests/ is reserved for twister test apps (Zephyr-module
# convention); python tests live with the package.
testpaths = ["scripts/rigexp/tests"]
markers = [
    "build: runs west/cmake builds (slow resolved-corpus goldens); deselect with -m 'not build'",
    "unit: exercises one unit IN-PROCESS against its own contract -- NO subprocess, since reaching code through the CLI front door makes a test integration by definition; and no Zephyr DATA (no real board .dts, no REPO_ROOT/dts or REPO_ROOT/include content, no build), for which conftest.assert_fixture_local() is the structural proof",
    "integration: exercises the system through its front door and/or against real repo content -- SCENARIOS and their outcomes (accepts and rejects alike) belong here, because a scenario does not exist at unit level; orthogonal to build, which only means a real west/cmake configure runs, so a hermetic fast test can still be integration",
]
